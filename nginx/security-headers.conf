# ==========================================
# HTTP Security Headers cho [your-domain.com]
# ==========================================

# 1. HTTP Strict Transport Security (HSTS)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 2. Ngăn chặn clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# 3. Chống MIME-sniffing
add_header X-Content-Type-Options "nosniff" always;

# 4. Kiểm soát thông tin Referrer khi chuyển tiếp liên kết
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 5. Hạn chế các API nhạy cảm của trình duyệt
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), fullscreen=(self)" always;

# 6. Content Security Policy (CSP) hỗ trợ Astro SSG, Giscus Comments và Google Fonts
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://giscus.app; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://at.alicdn.com; connect-src 'self' https://giscus.app; frame-src https://giscus.app; object-src 'none'; base-uri 'self'; form-action 'self';" always;
